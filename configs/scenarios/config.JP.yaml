# =================== STUDY SETUP ===================
countries: ["JP"] # ISO codes, continent, or custom region
# The PyPSA meets Earth initiative also provides some dedicated regional models
# adopting dedicated input data, country-specific constraints, and other
# region-specific features:
#
# - BN, KH, ID, LA, MY, MM, PH, SG, TH, TL, VN: [PyPSA-ASEAN](https://github.com/pypsa-meets-earth/pypsa-asean)
# - US: [PyPSA-NorthAmerica](https://github.com/pypsa-meets-earth/pypsa-northamerica)
#
# For these countries, users are encouraged to check the available regional
# models and contribute to their development.
run:
  name: "JP_po2023_cy2020_wy2023_dc2023" # optional; stores intermediate files in a subfolder (e.g. "KZ" → resources/KZ/, results/KZ/); empty = no subfolder
  sector_name: "JP" # optional; sector-coupling only — subfolder under results_dir/
  shared_cutouts: true # true: cutouts/ shared across runs; false: cutouts/{name}/ per run
  allow_scenario_failure: false # If True, the workflow will continue even if a scenario in run_scenario fails

scenario:
  simpl: [""]
  ll: ["v1"]
  clusters: [11]
  opts: [Co2L-1h] # hyphen-joined options: 3h/6h/24h/Nseg temporal | Co2L/Ep/CH4L caps & prices | ATK/ATKc autarky | {carrier}+p/c/m scale | CCL/BAU/SAFE/RES/EQ solve constraints — see doc/user-guide/wildcards.md
  planning_horizons: # investment years for myopic; costs year for overnight
  - 2023
  sopts:
  - "1h"

snapshots:
  start: "2023-01-01"
  end: "2024-01-01"
  inclusive: "left" # end is not inclusive

results_dir: results/ # solved networks and sector postprocessing (RESDIR in Snakefile)
summary_dir: results/ # summaries, plots, and copied configs (SDIR in Snakefile)


# =================== DATA RETRIEVAL ===================
enable:
  # ----------------- Retrieving data -----------------
  retrieve_databundle: true # recommended for first run
  download_osm_data: true # download OpenStreetMap data for the countries specified above
  retrieve_cutout: false # retrieves the bundled 2013 cutout (cutout-2013-era5); changing load_options.weather_year (default: 2013) requires retrieve_cutout:false and build_cutout: true.
  retrieve_cost_data: true # false: use existing data/costs.csv
  retrieve_databundle_sector: true
  download_global_buildings: false # download GlobalMLBuildingFootprints data for the countries specified above
  # ----------------- Building locally -----------------
  build_cutout: false # requires CDS API key (see https://cds.climate.copernicus.eu/how-to-api); uses snapshots and countries
  build_natura_raster: false
  # ----------------- Advanced -----------------
  progress_bar: true
  custom_busmap: false # optional override for cluster_network busmap

# ------------------- Demand -------------------
load_options:
  source: "demcast" # "gegis" (scenario-based: 2011, 2013, 2018 available) or "demcast" (hourly 2000–2024 available): view [issue #1724](https://github.com/pypsa-meets-earth/pypsa-earth/issues/1724) for more details
  weather_year: 2023 # Weather year of the load profile
  prediction_year: 2030 # Valid only if "gegis" used as a source
  scale: 1 # scales all load time-series, i.e. 2 = doubles load

# ------------------- Electricity grid -------------------
electricity:
  # ----------------- Electricity generation -------------------
  extendable_carriers:
    Generator: [] # Remove 'offwind-ac' and 'offwind-dc' for landlocked countries (e.g., Jordan, Austria, Switzerland)
    StorageUnit: [] # battery, H2, li-ion, vanadium, lfp, lair, pair, iron-air and more
    Store: [] # li-ion, vanadium, lfp, lair, pair, iron-air and more
    # See all available options for Store and StorageUnit in https://pypsa-earth.readthedocs.io/en/latest/user-guide/configuration/#storage-technologies
    Link: [] # H2 pipeline

  conventional_carriers: [nuclear, oil, OCGT, CCGT, coal, lignite, geothermal, biomass]
  renewable_carriers: [solar, onwind, offwind-ac, offwind-dc, hydro]

  # ----------------- Existing powerplants -------------------
  powerplants_filter: (DateOut >= 2023 or DateOut != DateOut) and (DateIn <= 2023 or DateIn != DateIn)
  custom_powerplants:
    filepaths:  # list of custom powerplant files used in "merge" and "replace" options
    - data/custom_powerplants.csv
    method: replace  # "false" use only powerplantmatching (ppm) data, "merge" combines ppm and custom powerplants, "replace" use only custom powerplants

  # If you wish to replace the data for just one country (e.g. United States), you can use the option powerplants_filter as follows:
  # powerplants_filter: ... and (Country != 'United States')
  # custom_powerplants:
  #   filepaths:
  #   - data/custom_powerplants_US.csv
  #   method: merge

  # ----------------- Grid topology -------------------
  base_voltage: 380.
  voltages: [132., 220., 300., 380., 500., 750.]
  hvdc_as_lines: false # false: HVDC as Link; true: HVDC as Line

  # ----------------- Constraints & reserve -------------------
  agg_p_nom_limits: # enables to set country-wise maximum and minimum generation capacities for generators (e.g. renewables, nuclear, and geothermal)
    file: data/agg_p_nom_minmax.csv # path to csv file containing country-wise generation capacity limits
    include_existing: false # false: only new built capacities are constrained; true: existing capacities are accounted in the constraints
lines:
  ac_types:
    132.: "243-AL1/39-ST1A 20.0"
    220.: "Al/St 240/40 2-bundle 220.0"
    300.: "Al/St 240/40 3-bundle 300.0"
    380.: "Al/St 240/40 4-bundle 380.0"
    500.: "Al/St 240/40 4-bundle 380.0"
    750.: "Al/St 560/50 4-bundle 750.0"
  dc_types:
    500.: "HVDC XLPE 1000"
  s_max_pu: 0.7
  s_nom_max: .inf
  s_nom_max_min: -.inf
  length_factor: 1.25
  under_construction: "zero" # 'zero': set capacity to zero, 'remove': remove, 'keep': with full capacity

# ------------------- Weather & renewables -------------------
atlite:
  nprocesses: 4
  cutouts:
    cutout-2023-era5:
      module: era5
      dx: 0.3 # cutout resolution
      dy: 0.3 # cutout resolution
      # The cutout time is automatically set by the snapshot range. See `snapshot:` option above and 'build_cutout.py'.
      # time: ["2013-01-01", "2014-01-01"]  # to manually specify a different weather year (~70 years available)
      # The cutout spatial extent [x,y] is automatically set by country selection. See `countries:` option above and 'build_cutout.py'.
      # x: [-12., 35.]  # set cutout range manual, instead of automatic by boundaries of country
      # y: [33., 72]    # manual set cutout range
  default: cutout-2023-era5

# ------------------- Costs & emissions -------------------
costs:
  year: 2020 # cost file selection, i.e. costs_2030.csv in this case; reference year for costs is always 2020
  technology_data_version: v0.15.0
  discountrate: [0.071] #, 0.086, 0.111]
  country_specific_data: "" # (optional) Reference to the desired technology-data directory for techno-economic input data; Only "" and "US" supported, for other values check the technology-data output directory
  # Only needed if "US" is selected as `country_specific_data`, otherwise ignore
  cost_scenario: "moderate" # only used if `country_specific_data: "US"`; can be "moderate", "advanced" or "conservative"
  financial_case: "market" # only used if `country_specific_data: "US"`; can be "market" or "r&d"
  # Management of output currencies and exchange rates
  output_currency: "JPY" # full list of supported currencies at https://github.com/alexprengere/currencyconverter/blob/master/currency_converter/eurofxref.csv
  default_exchange_rate: 0.7532 # previously USD2013_to_EUR2013; should be sufficient as current data from 'technology-data` are either in EUR or USD; [EUR/USD] ECB: https://www.ecb.europa.eu/stats/exchange/eurofxref/html/eurofxref-graph-usd.en.html
  future_exchange_rate_strategy: "reference" # reference: the exchange rate from `reference_year`, ensuring all costs are expressed in the same currency and year; "latest" uses the yearly average of the latest available exchange rates for the selected `output_currency`; "custom" allows to specify a `custom_future_exchange_rate`
  custom_future_exchange_rate: None # if `future_exchange_rate_strategy: "custom"`, please insert here the desired output_currency-to-EUR exchange rate
  rooftop_share: 0.14 # based on the potentials, assuming (0.1 kW/m2 and 10 m2/person)
  fill_values:
    FOM: 0
    VOM: 0
    efficiency: 1
    fuel: 0
    investment: 0
    lifetime: 25
    CO2 intensity: 0
    discount rate: 0.07
  marginal_cost: # EUR/MWh
    solar: 0.01
    onwind: 0.015
    offwind: 0.015
    hydro: 0.
    H2: 0.
    electrolysis: 0.
    fuel cell: 0.
    battery: 0.
    battery inverter: 0.
  # investment: # EUR/MW
  #   CCGT: 830000
  # FOM: # %/year
  #   nuclear: 10
  # VOM:
  #   CCGT: 4.2
  fuel: # EUR/MWh
  #  coal: 1780 # 2020, JPY2025/MWh_th / 10.53 EUR2025/MWh_th, Japan CIF coal import price (Ministry of Finance Trade Statistics / METI Energy White Paper 2020)
  #  oil: 4250 # 2020, JPY2025/MWh_th / 25.15 EUR2025/MWh_th, Japan Crude Cocktail (JCC) average import price (Ministry of Finance Trade Statistics / METI)
  #  gas: 4825 # 2020, JPY2025/MWh_th / 28.55 EUR2025/MWh_th, Japan average LNG import price 2020 (JOGMEC / Ministry of Finance Trade Statistics)
  #  nuclear: 630 # 2020, JPY2025/MWh_th / 3.73 EUR2025/MWh_th, METI Power Generation Cost Verification WG (fuel cycle cost = 1.7 JPY/kWh_e, converted with eff=0.33)
    coal: 3020 # 2023, JPY2025/MWh_th / 17.87 EUR2025/MWh_th, Japan CIF coal import price (Ministry of Finance Trade Statistics / METI Energy White Paper 2023)
    oil: 7480 # 2023, JPY2025/MWh_th / 44.25 EUR2025/MWh_th, Japan Crude Cocktail (JCC) average import price (Ministry of Finance Trade Statistics / JOGMEC)
    gas: 6810 # 2023, JPY2025/MWh_th / 40.29 EUR2025/MWh_th, Japan average LNG import price 2023 (JOGMEC / Ministry of Finance Trade Statistics)
    nuclear: 630 # 2023, JPY2025/MWh_th / 3.73 EUR2025/MWh_th, METI Power Generation Cost Verification WG (fuel cycle cost = 1.7 JPY/kWh_e, converted with eff=0.33)
  # lifetime: # years
  #   CCGT: 25.0
  efficiency: # per unit
    CCGT: 0.48 # METI
    oil: 0.38 # METI
    coal: 0.41 # METI

co2:
  limit: 9.348e+8     # annual cap [tCO2/year]; European default — adjust for your region; active via Co2L wildcard
  base: 4.465e+8     # baseline emissions used for relative reduction targets; European default
  emission_price: 0. # [currency/tCO2]; active via Ep wildcard
  automatic_emission: # derive co2.limit from historical emission data instead of the value above
    enable: false
    base_year: 1990  # any year from 1970 to 2018
  budget:            # year-by-year reduction trajectory; used in all sector-coupled runs
    enable: false
    override_co2opt: true
    base_value: limit # which co2 scalar to scale by year factors: "limit", "base", "absolute", or a float [tCO2/a]
    year:
      2020: 1.0
      2025: 0.85
      2030: 0.70
      2035: 0.55
      2040: 0.40
      2045: 0.25
      2050: 0.1

# =================== SECTOR OPTIONS ===================

# ------------------- Sector-coupled demand data -------------------
demand_data:
  scenario: "AB" # single demand-scenario label (formerly the {demand} wildcard; not a list)
  update_data: true # if true, the workflow downloads the energy balances data saved in data/demand/unsd/data again. Turn on for the first run.
  base_year: 2023
  other_industries: false # Whether or not to include industries that are not specified. some countries have has exaggerated numbers, check carefully.
  aluminium_year: 2023 # Year of the aluminium demand data specified in `data/AL_production.csv`

# ------------------- Brownfield capacities -------------------
existing_capacities:
  grouping_years_power: [1960, 1965, 1970, 1975, 1980, 1985, 1990, 1995, 2000, 2005, 2010, 2015, 2020, 2023, 2025, 2030]

fossil_reserves:
  oil: 0

# ------------------- Enabled sectors & fuel infrastructure -------------------
sector:
  enable:
    heat: true
    biomass: true
    industry: true
    shipping: true
    aviation: true
    land_transport: true
    rail_transport: true
    agriculture: true
    residential: true
    services: true

  ammonia:
    enable: false
    spatial_ammonia: false
    production_year: 2023 # 2019 - 2023 are available
    gas_MWh_per_tNH3: 7.81   # MWh natural gas per tNH3 (SMR eff.=0.76, HB H2-input=1.1484 MWh_H2/MWh_NH3, NH3 LHV=5.167 MWh/t)
    elec_MWh_per_tNH3: 1.278  # MWh electricity per tNH3 (HB elec-input=0.2473 MWh_el/MWh_NH3, NH3 LHV=5.167 MWh/t)
    co2_t_per_tNH3: 1.547    # tCO2 per tNH3 (gas CO2 intensity=0.198 tCO2/MWh_gas x 7.81 MWh_gas/tNH3)

  # ------------------- Land transport sector -------------------
  land_transport_fuel_cell_share: # 1 means all FCEVs HERE
    AB_2023: 0.0

  land_transport_electric_share: # 1 means all EVs  # This leads to problems when non-zero HERE
    AB_2023: 0.0

  # ------------------- Shipping & aviation sector -------------------
  shipping_hydrogen_share: #1.0
    AB_2023: 0.0

# =================== SOLVING ===================
# Optimization options, memory limit, and named solver presets live in
# configs/solving.default.yaml (merged via Snakefile configfile:).
solving:
  # ------------------- Solver -------------------
  solver:
    name: gurobi
    options: gurobi-default