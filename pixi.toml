[workspace]
name = "pypsa-earth"
channels = ["conda-forge", "bioconda", "gurobi"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.10,<3.14"
pip = "*"

pypsa = ">=0.33"
linopy = ">=0.6.5,<0.9"
atlite = "==0.4.1" # in versions >0.4.1 the computation of availability matrix in `build_renewable_profiles` fails due to https://github.com/PyPSA/atlite/issues/301 https://github.com/PyPSA/atlite/issues/514 for countries whose cutouts span over geometries crossing the antimeridian
dask = "*"
powerplantmatching = ">=0.8"
earth-osm = ">=3.0.2"

# Dependencies of the workflow itself
xlrd = "*"
openpyxl = "*"
seaborn = "*"
snakemake-minimal = ">=8.26.0"
snakemake-storage-plugin-http = ">=0.3"
snakemake-storage-plugin-cached-http = ">=0.2.1"
memory_profiler = "*"
"ruamel.yaml" = ">=0.17"
pytables = "*"
pyscipopt = "*"
scip = "<=10.0.2"  # experienced issues with 10.0.3 and 10.1. ImportError: libscip.so.10.0: cannot open shared object file
lxml = "*"
numpy = ">=1.26.4"
pandas = "<3"
geopandas = ">=1"
fiona = ">=1.10"
xarray = ">=2026.1"
netcdf4 = "*"
libgdal-netcdf = "*"
networkx = "*"
scipy = "*"
shapely = "!=2.0.4"
pre-commit = "*"
matplotlib = "*"
reverse-geocode = "*"
country_converter = "*"
pyogrio = "*"
numba = "*"
py7zr = "*"
tsam = ">=1.1.0"
fake-useragent = "*"
chaospy = "*"
geopy = "*"
tqdm = "*"
pytz = "*"
currencyconverter = "*"
googledrivedownloader = ">=1.1"

# Jupyter notebook requirements
ipykernel = "*"
ipython = "*"
jupyterlab = "*"

# GIS dependencies
cartopy = "*"
rasterio = "*"
rioxarray = "*"

# Plotting
geoviews = "*"
hvplot = "*"
graphviz = "*"
contextily = "*"

# Default solver for tests (required for CI)
glpk = "*"
highs = "*"
gurobi = "*"

# Command Line Interface
rich = "*"

[environments]
pypsa-earth = ["default"]
pypsa-earth-cli = ["pypsa-earth-cli"]

[tasks]
install-kernel = "ipython kernel install --user --name=pypsa-earth"

[feature.pypsa-earth-cli.dependencies]
inquirerpy = "*"
typer = "*"

[feature.pypsa-earth-cli.tasks]
pypsa-earth-cli = "python scripts/non_workflow/pypsa_earth_cli.py"
