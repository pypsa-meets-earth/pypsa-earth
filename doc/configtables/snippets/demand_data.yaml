demand_data:
  scenario: "AB" # single demand-scenario label (formerly the {demand} wildcard; not a list)
  unsd_source: "legacy" # Options: "legacy" (archived UNdata exports), "sdmx" (UNSD SDMX API).
  unsd_max_year_gap: 0 # Maximum lookback in years for missing base-year observations (SDMX only). 0 requires exact-year data.
  update_data: true # Refresh UNSD data when retrieval runs. If false, reuse existing cached data.
  base_year: 2019
  other_industries: false # Whether or not to include industries that are not specified. some countries have has exaggerated numbers, check carefully.
  aluminium_year: 2019 # Year of the aluminium demand data specified in `data/AL_production.csv`
