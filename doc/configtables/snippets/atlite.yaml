atlite:
  nprocesses: 4
  default: derive_from_snapshots # Use an explicit cutout name or derive it from snapshots
  cutouts:
    derive_from_snapshots:
      name_template: "cutout-{year}-{module}" # File stem; e.g. cutout-2013-era5.nc
      module: era5
      dx: 0.3 # cutout resolution
      dy: 0.3 # cutout resolution
      # The cutout time is automatically derived from `snapshots`. See `snapshots:` above and `build_cutout.py`.
      # The cutout spatial extent [x,y] is automatically set by country selection. See `countries:` option above and 'build_cutout.py'.
      # x: [-12., 35.]  # set cutout range manual, instead of automatic by boundaries of country
      # y: [33., 72]    # manual set cutout range
